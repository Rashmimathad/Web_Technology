<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Prime Video</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/6612/6612880.png">
    <style>
        body{
            background-color: black;
        }
        #nav-bar{
            background-color: rgb(20, 20, 20);
            padding: 20px;
            display:inline-flex;
            position: sticky;
            top: 0px;
            border-bottom-right-radius: 30px;
            position: fixed;
            top: 0px;
        }
        #logo{
            height: 40px;
            width: 130px;
            padding-left: 100px;
            padding-top: 35px;

        }
        #nav{
             padding-top: 20px;
            margin-left: 70px;
            padding-bottom: 30px;
        }
        a{
            border-radius: 10px;
            color: white;
            border-width: 1px;
            margin-left: 70px;
            padding: 20px;
            font-size: 30px;
            font-family:Arial, Helvetica, sans-serif;
            font-weight: bold;
            justify-content: space-between;
        }
        a:hover{
            color: black;
            background-color: rgb(239, 237, 237);
        }

        #search-icon{
            width:45px;
            height:40px;
            margin-left: 710px;
            padding-top: 35px;
        }
        #search-icon:hover{
            background-image: url("https://wonderclub.com/images/search.png");
            background-color: rgb(239, 237, 237);
            border-radius: 50%;
            padding: 15px;
        }

        #line{
            font-size:50px;
            color: rgba(158, 155, 155, 0.731);
            display: inline-block;
            padding-left: 35px;
            font-weight:900;
        }
        #lang{
            color: white;
            background-color: black;
            border-width: 0px;
            margin-left: 40px;
            font-size: 30px;
            width: 120px;
            font-family:Arial, Helvetica, sans-serif;
            font-weight: bold;
            padding: 3px;
        }

        #lang:hover{
            color: black;
            background-color: rgb(239, 237, 237);
            border-radius: 15px;
        }

        #grid{
            height: 30px;
            width: 30px;
            margin-left: 35px;
            padding-top: 40px;
        }

        #grid:hover{
            padding: 30px;
            border-radius: 50px;
            background-color: rgb(239, 237, 237);
        }

        #profile-image{
            height: 70px;
            width: 90px;
            margin-left: 40px;
            padding: 20px;
            padding-top: 20px;
            padding-bottom: 20px;
        }

        #profile-image:hover{
             padding: 20px;
            padding-top: 20px;
            padding-bottom: 20px;
            background-color: white;
            border-radius: 50px;
        }

        #join{
            background-color: rgba(91, 124, 234, 0.995);
            color: white;
            font-size: 30px;
            font-family:Arial, Helvetica, sans-serif;
            font-weight: bold;
            margin-left: 40px;
            padding: 20px;
            border-radius: 15px;
        }

        h1{
            font-size:100px;
            font-family:Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: white;
            padding-left: 120px;
            padding-top: 80px;
        }

        h3{
            font-size: 41px;
            font-family:Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: white;
            padding-left: 120px;
            padding-top: 75px;
        }

        #sign-in{
            background-color:white;
            color: black;
            font-size: 40px;
            font-family:Arial, Helvetica, sans-serif;
            font-weight: bold;
            margin-left: 120px;
            margin-top: 50px;
            padding: 35px;
            border-radius: 20px;
        }

        #main{
           height: 1550px;
           display: flex;
           margin-top: 150px;
        }

        #content{
            display: inline-block;
            height: 1000px;
            width: 140%;
        }
        #movies{
            margin-left:100px;
            background: linear-gradient(to right,rgba(6, 0, 0, 0.954),rgb(4, 8, 252));
            height: 830px;
            width: 155%;
            display: flex;
            flex-wrap: wrap;
            justify-content:space-evenly;
            align-items:flex-start;
            padding-top: 30px;
            padding-bottom:430px;
            padding-left: 100px;
        }
        #movies img{
            height: 380px;
            width: 650px;
            border:5px solid #196ffaf3;
            border-radius: 30px;
           
        }

        
    </style>
</head>
<body>
    <nav>
        <div id="nav-bar">
            <img src="https://m.media-amazon.com/images/G/01/digital/video/web/logo-min-remaster.png" alt="primevideo" id="logo">
            <div id="nav">
                <a>Home</a>
                <a>Movies</a>
                <a>TV Shows</a>
                <a>Live TV</a>
                <span id="line">|</span>
                <a>Subscriptions</a>
            </div>
            <img src="https://www.citypng.com/public/uploads/small/116400840186bmo0mkghcdq8hn99wmpbh9wrgbytghidisi7e41vegbclccrb6kg9hrk0ebgqrpc5ezz2tjtkvsfsvk7yfbakowxbpvrzsakde3.png" alt="search-icon" id="search-icon">
            <select name="lang" id="lang">
               <option value="EN">EN</option>
               <option value="bahasa">Bahasa Indoneasia</option>
               <option value="kannada">kannada</option>
               <option value="telugu">Telugu</option>
               <option value="hindi">Hindi</option>
            </select>
            <img src="./grid.jpg" alt="grid" id="grid">
            <img src="https://www.pngall.com/wp-content/uploads/5/User-Profile-PNG-Image.png" alt="profile-image" id="profile-image">
            <button id="join">Join Prime</button>
        </div>
    </nav>
   
    <div id="main">
        <div id="content">
            <h1>Welcome to Prime Video</h1>
            <h3>Join Prime to watch the latest movies, TV shows and award-winning <br>Amazon Originals</h3>
            <button id="sign-in">Sign in to join Prime</button>
        </div>
        <div id="movies">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYEFKJrV33izmM8AMGNsY5ZpmssjgEFoYRZg&s" id="m1" alt="coolie">
            <img src="https://tse2.mm.bing.net/th/id/OIP.1nc5QfBFsbGy9KGrkdRRYQHaK0?pid=Api&P=0&h=180" id="m2" alt="googly">
            <img src="https://tse1.mm.bing.net/th/id/OIP.-6490KmdYW5jBTmay1fg9gHaKf?pid=Api&P=0&h=180" id="m3" alt="majili">
            <img src="https://tse2.mm.bing.net/th/id/OIP.EAsj6hLmGMZ8iQm3rywh6wHaKf?pid=Api&P=0&h=180" id="m4" alt="sarileru">
            <!-- <img src="https://tse3.mm.bing.net/th/id/OIP.90PKMNmTYyT0xdqycQqLIQHaKU?pid=Api&P=0&h=180" alt="hanuman">
            <img src="https://tse3.mm.bing.net/th/id/OIP.Aa0_1ovrxlXuJ82EZI3O7gHaKl?pid=Api&P=0&h=180" alt="rajkumara">     -->
        </div>

    </div>
</div>
</body>
</html>
